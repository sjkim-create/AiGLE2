# AiGLE 장애신고 → Jira 중계 Worker
name = "aigle-jira-relay"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
JIRA_BASE = "https://neolab-convergence.atlassian.net"
JIRA_PROJECT = "AGI"
JIRA_ISSUE_TYPE = "Task"
# 이슈 담당자 — Jira 목록 링크의 assignee 계정 ID (여기에 지정해야 그 목록에 쌓인다)
JIRA_ASSIGNEE = "712020:bb91b68a-a0c1-4273-9fe3-c6872c239498"
# 호출을 허용할 웹앱 origin (쉼표 구분). 비우면 전부 허용
ALLOWED_ORIGINS = "https://aigle2-ff923.web.app,https://aigle2-ff923.firebaseapp.com,http://localhost:5173,http://localhost:5174"

# 비밀값은 여기 적지 않는다 — `wrangler secret put JIRA_EMAIL` / `wrangler secret put JIRA_API_TOKEN`
